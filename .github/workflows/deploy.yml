# =============================================================
# ByteCommerce CI/CD Pipeline (P10.2)
#
# Trigger : push ke main / develop (dan manual via Actions UI)
# Jobs    : test  -> unit & integration tests (Jest)
#           build -> build + push Docker image ke GHCR
#           deploy-> trigger Render deploy hook (khusus main)
#
# Secrets yang dibutuhkan:
#   - RENDER_DEPLOY_HOOK_URL : webhook deploy dari Render
#     (Dashboard > Service > Deploy > Deploy Hook)
# =============================================================

name: CI/CD

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-backend

jobs:
  # ---------- Job 1: Test ----------
  test:
    name: Test (Jest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: bytecommerce_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d bytecommerce_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Initialize test database schema
        run: psql -h localhost -U test_user -d bytecommerce_test -f database/init.sql
        env:
          PGPASSWORD: test_password

      - name: Seed test database
        run: psql -h localhost -U test_user -d bytecommerce_test -f database/seeds.sql
        env:
          PGPASSWORD: test_password

      - name: Run tests
        working-directory: backend
        env:
          NODE_ENV: test
          PORT: 5000
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/bytecommerce_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test_secret_only_for_ci
        # --passWithNoTests: pipeline tetap hijau sampai suite P11 ditambahkan
        run: npm test -- --passWithNoTests

  # ---------- Job 2: Build & Push Image ----------
  build:
    name: Build Docker image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login ke GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------- Job 3: Deploy ke Render (hanya main) ----------
  deploy:
    name: Deploy to Render
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - name: Trigger Render deploy hook
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
